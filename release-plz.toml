[workspace]
release = false
git_only = true
repo_url = "https://codeberg.org/wvhulle/lazaret"
semver_check = false
git_release_type = "prod"
release_commits = "^(feat|fix|perf)[(:!]"
features_always_increment_minor = true
pr_labels = ["release"]
git_release_body = """
{{ changelog }}

## Install

Download `lazaret-x86_64.flatpak` for any x86_64 Linux distribution and install it with `flatpak install --user lazaret-x86_64.flatpak`. It has a `.sha256` checksum and a `.minisig` signature next to it; verify the signature with `minisign -Vm lazaret-x86_64.flatpak -p minisign.pub`, using `minisign.pub` from the repository. ClamAV itself comes from your distribution.

On Debian, Ubuntu, Fedora and Arch Linux you can also [build from source](https://codeberg.org/wvhulle/lazaret/src/tag/v{{ version }}/docs/install/from-source.md) with `make deps`, `make build` and `sudo make install`, which includes live tuning of clamd. See the [installation guides](https://codeberg.org/wvhulle/lazaret/src/branch/main/docs/install) for NixOS and the other options.
"""

[[package]]
name = "lazaret"
changelog_path = "CHANGELOG.md"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
release = true
changelog_include = [
  "lazaret-clamav-admin",
  "lazaret-clamd-configuration",
  "lazaret-translation-codegen",
]

[changelog]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^style", group = "Changed" },
  { message = "^test", group = "Testing" },
  { message = "^chore: release", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = ".*", skip = true },
]
