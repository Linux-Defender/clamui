when:
  - repo: wvhulle/lazaret
    event: [pull_request, push]
    branch: main
    path:
      - .woodpecker/source-install.yaml
      - Makefile
      - xtask/src/**
      - clamav_admin_service/**
      - clamd_configuration/**
      - data/**
      - src/**
      - nix/**
      - flake.nix
      - flake.lock
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml

labels:
  host: ryzen

variables:
  - &nix_download_environment
    XDG_CACHE_HOME: /woodpecker/nix-cache
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=

steps:
  - name: prepare-ci-tools
    image: nixos/nix:latest
    environment: *nix_download_environment
    commands:
      - nix run --quiet .#prepare-ci-tools

  - name: install-on-debian
    image: debian:trixie
    depends_on: [prepare-ci-tools]
    environment:
      CARGO_TARGET_DIR: target/debian
    commands:
      - .ci-tools/xtask check-source-install

  - name: install-on-ubuntu
    image: ubuntu:26.04
    depends_on: [prepare-ci-tools]
    environment:
      CARGO_TARGET_DIR: target/ubuntu
    commands:
      - .ci-tools/xtask check-source-install

  - name: install-on-fedora
    image: fedora:latest
    depends_on: [prepare-ci-tools]
    environment:
      CARGO_TARGET_DIR: target/fedora
      CLAMD_CONFIG: /etc/clamd.d/scan.conf
      CLAMD_UNIT: clamd@scan.service
    commands:
      - .ci-tools/xtask check-source-install

  - name: install-on-arch
    image: archlinux:latest
    depends_on: [prepare-ci-tools]
    environment:
      CARGO_TARGET_DIR: target/arch
    commands:
      - .ci-tools/xtask check-source-install
